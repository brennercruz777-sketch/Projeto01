{% extends 'app/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card card-clean p-4">
            <h4 class="fw-bold mb-3 text-white"><i class="bi bi-pencil-square text-info me-2"></i>{{ titulo_pagina }}</h4>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <div class="d-flex gap-2 justify-content-end mt-4">
                    <a href="{% url 'painel_gestao' %}" class="btn btn-light-clean px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary-clean px-4">Guardar Vaga</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
