{% extends 'app/base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card card-clean p-4 text-center">
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle-fill fs-1 text-warning"></i>
            </div>
            
            <h4 class="fw-bold text-white mb-2">Eliminar Vaga</h4>
            <p class="text-muted mb-4">
                Tem a certeza de que deseja eliminar a vaga <strong class="text-white">"{{ vaga.titulo_vaga }}"</strong> da empresa <strong class="text-white">{{ vaga.empresa }}</strong>? Esta ação não pode ser desfeita.
            </p>

            <form method="post" class="d-flex gap-3 justify-content-center">
                {% csrf_token %}
                <a href="{% url 'painel_gestao' %}" class="btn btn-light-clean px-4 py-2">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">
                    <i class="bi bi-trash me-1"></i> Sim, Eliminar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
