{% extends 'app/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <a href="{% url 'lista_vagas' %}" class="btn btn-outline-secondary btn-sm mb-3">
            &larr; Voltar para as vagas
        </a>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <span class="badge bg-secondary mb-2">{{ vaga.modalidade }}</span>
                        <h2 class="card-title h3 mb-1">{{ vaga.titulo_vaga }}</h2>
                        <h5 class="text-muted fw-normal">{{ vaga.empresa }}</h5>
                    </div>
                    <span class="fs-4 fw-bold text-success">€ {{ vaga.salario }}</span>
                </div>

                <hr class="my-4">

                <div class="mb-4">
                    <h5 class="fw-bold mb-3">Requisitos e Descrição</h5>
                    <p class="card-text text-body-secondary style-description" style="white-space: pre-line;">
                        {{ vaga.requisitos }}
                    </p>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                    <button class="btn btn-primary btn-lg px-4 me-md-2" onclick="alert('Candidatura enviada com sucesso!')">
                        Candidatar-me a esta Vaga
                    </button>
                    <a href="{% url 'lista_vagas' %}" class="btn btn-outline-secondary btn-lg px-4">
                        Voltar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
