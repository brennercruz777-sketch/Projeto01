{% extends 'app/base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-4">
        <div class="card card-clean p-4 text-center">
            <div class="mb-3">
                <i class="bi bi-shield-lock fs-1 text-primary"></i>
            </div>
            <h4 class="fw-bold mb-1">Acesso Restrito</h4>
            <p class="text-muted small mb-4">Entre com a sua conta para gerir as vagas.</p>

            <form method="post" class="text-start">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary-clean w-100 py-2 mt-2">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
